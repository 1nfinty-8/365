<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Infinity</title>
<style>
:root{
  --ink:#4a4f57;--ink-soft:#9298a2;
  --back-tint:rgba(255,255,255,.22);--back-edge:rgba(255,255,255,.65);
  --flake-core:rgba(255,255,255,.95);--flake-glow:rgba(190,210,245,.8);
  --lg-a:rgba(255,255,255,.05);--lg-b:rgba(255,255,255,.01);--lg-c:rgba(230,238,250,.025);
  --edge-hi:rgba(255,255,255,.95);--edge-cool:rgba(165,195,255,.5);--edge-warm:rgba(255,205,225,.4);
  --glow:rgba(255,255,255,.4);
  --shadow:0 22px 44px rgba(96,106,126,.18);
  --f-script:"Snell Roundhand","Savoye LET","Apple Chancery","Zapfino","Segoe Script",cursive;
  --f-en:"Didot","Bodoni 72",serif;
  --f-cn:"Songti SC","STSongti-SC","Noto Serif SC","SimSun",serif;
}
html.dk{
  --ink:#eef1f6;--ink-soft:#979eab;
  --back-tint:rgba(120,135,165,.14);--back-edge:rgba(255,255,255,.3);
  --flake-glow:rgba(170,195,255,.7);
  --lg-a:rgba(135,152,185,.05);--lg-b:rgba(80,92,118,.01);--lg-c:rgba(150,165,200,.02);
  --edge-hi:rgba(255,255,255,.55);--edge-cool:rgba(150,185,255,.45);--edge-warm:rgba(255,185,215,.3);
  --glow:rgba(195,212,255,.3);
  --shadow:0 24px 50px rgba(0,0,0,.5);
}
[hidden]{display:none!important}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html,body{height:100%;overflow:hidden;background:transparent;}
body{position:fixed;inset:0;touch-action:none;color:var(--ink);font-family:var(--f-en),var(--f-cn);display:flex;align-items:center;justify-content:center;}
#snow{position:fixed;inset:0;z-index:0;pointer-events:none;}

.stage{position:relative;z-index:2;perspective:1100px;transform:translateY(-3vh);}
.stage.fl1{animation:flA .27s ease-in forwards}
@keyframes flA{to{transform:translateY(-3vh) scaleX(0)}}
.stage.fl2{animation:flB .42s cubic-bezier(.2,.9,.3,1)}
@keyframes flB{from{transform:translateY(-3vh) scaleX(0)}}
.tilt{transition:transform .25s ease-out;transform-style:preserve-3d;}
.folder{position:relative;width:min(76vw,300px);height:252px;cursor:pointer;}

.folder-back{position:absolute;left:5%;right:5%;top:30px;bottom:12px;z-index:1;border-radius:20px;background:var(--back-tint);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--back-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--shadow);}
.folder-back::before{content:"";position:absolute;top:-17px;right:0;width:44%;height:24px;background:var(--back-tint);
  border:1px solid var(--back-edge);border-bottom:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:12px 15px 0 0;}
.folder-back::after{content:"";position:absolute;top:-16px;right:calc(44% - 2px);width:26px;height:17px;background:var(--back-tint);
  border-radius:12px 0 0 0;transform:skewX(-34deg);transform-origin:bottom right;}

/* 雪花串：挂在最前面，不被玻璃挡住，也不挡手指 */
.snow-string{position:absolute;top:12px;right:15%;width:0;z-index:8;pointer-events:none;transform-origin:top center;animation:sway 6.5s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
.snow-string::before{content:"";position:absolute;left:-.5px;top:0;width:1px;height:var(--line,80px);opacity:.5;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.8) 25%,transparent);}
.glassy{filter:drop-shadow(0 0 3px var(--flake-core)) drop-shadow(0 0 14px var(--flake-glow));}
.anchor{position:absolute;top:6px;left:2px;transform:translate(-50%,-50%);animation:breath 4.5s ease-in-out infinite;}
@keyframes breath{0%,100%{opacity:.95}50%{opacity:.65}}
.anchor svg{display:block;animation:flutter 8s ease-in-out infinite alternate;}
.flake{position:absolute;transform:translate(-50%,-50%);transition:transform .7s cubic-bezier(.2,2.1,.3,.85),top .5s,opacity .5s;}
.flake svg{display:block;animation:flutter var(--d,4s) ease-in-out infinite alternate;}
@keyframes flutter{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
.flake i{position:absolute;left:var(--ox,14px);top:var(--oy,-5px);width:3.5px;height:3.5px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 11px 1px -1px rgba(255,255,255,.8);}
.flake.enter{animation:dropIn .7s cubic-bezier(.2,1.4,.3,1);}
@keyframes dropIn{from{opacity:0;margin-top:-30px}to{opacity:1;margin-top:0}}

/* ===== 牌：随机的一摊，毛玻璃 ===== */
.cards{position:absolute;inset:0;z-index:3;pointer-events:none;}
.folder.open .cards{z-index:6;}
.file-card{position:absolute;left:calc(50% - 21px);bottom:14px;width:42px;height:64px;transform-origin:50% 50%;
  transform:translate(var(--sx),var(--sy)) rotate(var(--s)) scale(.95);
  transition:transform .5s cubic-bezier(.22,1.25,.36,1),transform-origin .5s,opacity .4s;transition-delay:var(--dl,0s);pointer-events:auto;}
.file-card.enter{animation:cardIn .7s cubic-bezier(.2,1.4,.3,1) both}
@keyframes cardIn{from{opacity:0;margin-bottom:220px}}
.folder.open .file-card{transform-origin:50% 300%;transform:rotate(var(--a)) translateY(-40px);}
.file-card.picked{z-index:99!important;opacity:0;transform:rotate(0deg) translateY(-320px) scale(1.7)!important;
  transition:transform .55s cubic-bezier(.5,0,.3,1),opacity .55s ease-in!important;transition-delay:0s!important}
.pad{width:100%;height:100%;border-radius:7px;position:relative;overflow:hidden;
  background:linear-gradient(165deg,rgba(255,255,255,.82),rgba(238,242,248,.62) 55%,rgba(250,251,253,.74));
  border:1px solid rgba(255,255,255,.95);
  box-shadow:inset 0 1px 1px #fff,inset 0 0 8px rgba(255,255,255,.5),0 3px 8px rgba(80,95,125,.12);
  transform:translateY(calc(var(--lift,0px) * -1));transition:transform .1s ease-out;}
.pad::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 30% 0%,rgba(255,255,255,.7),transparent 60%);pointer-events:none}
html.dk .pad{background:linear-gradient(165deg,rgba(120,132,158,.5),rgba(70,80,102,.4) 55%,rgba(100,112,138,.45));border-color:rgba(255,255,255,.3)}
.file-card.settle .pad{transition:transform .4s cubic-bezier(.2,1.6,.3,.9);}

.glass{position:absolute;left:0;right:0;top:74px;bottom:0;z-index:4;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,var(--lg-a),var(--lg-b) 50%,var(--lg-c));
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 18px 38px rgba(96,106,126,.14);
  transform-origin:bottom center;transition:transform .55s cubic-bezier(.22,1.2,.36,1);}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(135deg,var(--edge-hi) 0%,var(--edge-cool) 22%,transparent 40%,transparent 60%,var(--edge-warm) 78%,var(--edge-hi) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.glass::after{content:"";position:absolute;top:-30%;left:-20%;width:50%;height:160%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.08) 45%,rgba(255,255,255,.02) 55%,transparent);transform:rotate(8deg);pointer-events:none;}
.glass .glow{position:absolute;inset:-30%;pointer-events:none;opacity:var(--gon,0);
  background:radial-gradient(100px 80px at var(--gx,50%) var(--gy,30%),var(--glow),transparent 72%);mix-blend-mode:overlay;transition:opacity .5s;filter:blur(7px);}
@media (hover:hover){ .folder:hover .glass{transform:rotateX(7deg);} }
.folder.open .glass{transform:rotateX(13deg) translateY(2px);}
.glass-title{position:absolute;left:20px;bottom:6px;font-family:var(--f-script);font-size:32px;font-weight:400;line-height:1.7;padding-right:10px;
  background:linear-gradient(120deg,var(--ink) 60%,var(--ink-soft));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.cnt{position:absolute;right:20px;bottom:18px;font-family:var(--f-en);font-style:italic;font-size:15px;color:var(--ink-soft)}

.toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:-80px;text-align:center;white-space:nowrap;}
.add-btn{display:inline-block;padding:7px 20px;border-radius:999px;background:var(--lg-a);border:1px solid var(--edge-hi);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-family:var(--f-cn);font-size:12px;letter-spacing:.3em;cursor:pointer;}
.tip{margin-top:8px;font-size:10px;letter-spacing:.2em;color:var(--ink-soft);font-family:var(--f-cn);}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="armGlass">
      <path d="M0 0 L0 -44 M0 -27 L10 -36 M0 -27 L-10 -36 M0 -14 L7 -21 M0 -14 L-7 -21" stroke="rgba(255,255,255,.45)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M0 0 L0 -44 M0 -27 L10 -36 M0 -27 L-10 -36 M0 -14 L7 -21 M0 -14 L-7 -21" stroke="rgba(255,255,255,.95)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
    <symbol id="sf" viewBox="-54 -54 108 108">
      <use href="#armGlass"/><use href="#armGlass" transform="rotate(60)"/>
      <use href="#armGlass" transform="rotate(120)"/><use href="#armGlass" transform="rotate(180)"/>
      <use href="#armGlass" transform="rotate(240)"/><use href="#armGlass" transform="rotate(300)"/>
      <circle r="4.5" fill="rgba(255,255,255,.9)"/>
    </symbol>
  </defs>
</svg>

<canvas id="snow"></canvas>

<div class="stage" id="stage">
  <div class="tilt" id="tilt">
    <div class="folder" id="folder">
      <div class="folder-back"></div>
      <div class="cards" id="cards"></div>
      <div class="glass" id="glass">
        <div class="glow"></div>
        <div class="glass-title">Infinity</div>
        <div class="cnt" id="cnt">0</div>
      </div>
      <div class="snow-string" id="string">
        <span class="anchor glassy"><svg width="100" height="100"><use href="#sf"/></svg></span>
      </div>
    </div>
    <div class="toolbar">
      <span class="add-btn" id="listBtn" hidden>收好的 · 0</span>
      <div class="tip" id="tip">轻触打开文件夹</div>
    </div>
  </div>
</div>

<script>
/* ===== 深浅色跟着 365 的「外观」 ===== */
const root=document.documentElement;
const syncDark=()=>{try{root.classList.toggle('dk',window.parent.document.documentElement.classList.contains('dk'))}catch(e){}};
syncDark();
const isDark=()=>root.classList.contains('dk');

const stage=document.getElementById('stage'),folder=document.getElementById('folder'),tilt=document.getElementById('tilt'),string=document.getElementById('string'),
      cards=document.getElementById('cards'),glass=document.getElementById('glass'),
      tip=document.getElementById('tip'),cnt=document.getElementById('cnt'),listBtn=document.getElementById('listBtn');
const P=(()=>{try{return window.parent!==window&&window.parent.INF?window.parent.INF:null}catch(e){return null}})();
const num=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const hf=(k,m)=>((k*m+m*7919)%10007)/10007;
const POOL=15;
let picking=false,booted=false,seq=0;

/* ---------- 牌：随手倒进去的一摊；抽走一张，补上一张 ---------- */
const live=()=>[...cards.querySelectorAll('.file-card:not(.picked)')];
function makeCard(enter){
  const el=document.createElement('div');
  el.className='file-card'+(enter?' enter':'');el.dataset.k=num('c'+(seq++)+'-'+Math.random());
  el.innerHTML='<div class="pad"></div>';
  cards.appendChild(el)}
function layoutArc(){
  const L=live(),n=L.length,sp=Math.min(96,n*6.5);
  L.forEach((el,i)=>{const k=+el.dataset.k,a=hf(k,131),b=hf(k,257),c=hf(k,373),d=hf(k,491);
    el.style.setProperty('--sx',((a+b-1)*86)+'px');
    el.style.setProperty('--sy',-(62+c*82)+'px');
    el.style.setProperty('--s',((d*2-1)*40)+'deg');
    el.style.setProperty('--a',(n<2?0:-sp/2+sp*i/(n-1))+'deg');
    el.style.setProperty('--dl',(i*14)+'ms');
    el.style.zIndex=folder.classList.contains('open')?i:(k%50)})}
for(let i=0;i<POOL;i++)makeCard(false);layoutArc();

/* ---------- 雪花串：讲一段，挂一片（最多 6 片） ---------- */
const SIZES=[40,20,34,18,28,22];
const liveF=()=>[...string.querySelectorAll('.flake')];
function makeFlake(enter){
  const i=liveF().length,el=document.createElement('span');
  el.className='flake glassy'+(enter?' enter':'');
  el.style.setProperty('--d',(3+(i*.7)%2.8)+'s');
  el.style.setProperty('--ox',(i%2?-18:16)+'px');
  el.style.setProperty('--oy',(-4-(i%3)*6)+'px');
  const s=SIZES[i%SIZES.length];
  el.innerHTML=`<svg width="${s}" height="${s}"><use href="#sf"/></svg><i></i>`;
  string.appendChild(el)}
function layoutString(){
  const F=liveF();string.style.setProperty('--line',(F.length*28+56)+'px');
  F.forEach((el,i)=>{el.style.top=(i*28+52)+'px';el.style.left=(Math.sin(i*1.9)*12)+'px'})}
function syncFlakes(d){
  d=Math.min(d,6);const F=liveF();
  for(let i=F.length;i<d;i++)makeFlake(booted);
  F.slice(d).forEach(fl=>fl.remove());
  layoutString()}

/* ---------- 状态 ---------- */
function status(){
  const n=P?P.count():0,b=P?P.busy():false;
  cnt.textContent=n;
  tip.textContent=b?'他在想…':folder.classList.contains('open')?'划过牌浪 · 点一张':'轻触打开文件夹';
  listBtn.hidden=!n;listBtn.textContent='收好的 · '+n}
window.ifSync=()=>{syncFlakes(P?P.count():0);status()};
window.ifSync();booted=true;

/* ---------- 翻面：文件夹自己左右翻，毛玻璃不会丢 ---------- */
let flipping=false;
window.ifFlip=cb=>{if(flipping)return;flipping=true;folder.classList.remove('open');layoutArc();riffleReset();
  stage.classList.add('fl1');
  setTimeout(()=>{try{cb&&cb()}catch(e){}stage.classList.remove('fl1');stage.classList.add('fl2');
    setTimeout(()=>{stage.classList.remove('fl2');flipping=false;status()},430)},280)};

/* ---------- 抽一张 ---------- */
function pickEl(el){
  if(picking||!P||P.busy()||el.classList.contains('picked'))return;
  picking=true;riffleReset();
  el.classList.add('picked');navigator.vibrate?.(15);
  setTimeout(()=>{el.remove();makeCard(true);layoutArc();picking=false;status()},560);
  P.pick()}

/* ================= 常规交互 ================= */
let moved=false,downX=0,downY=0;
folder.addEventListener('pointerup',e=>{
  if(moved||flipping)return;
  const c=e.target.closest('.file-card');
  if(c&&folder.classList.contains('open')){pickEl(c);return}
  folder.classList.toggle('open');layoutArc();riffleReset();status()});
listBtn.addEventListener('click',()=>P?.list());

function riffle(px){
  if(!folder.classList.contains('open')||picking)return;
  const L=live(),xs=L.map(el=>{const r=el.getBoundingClientRect();return r.left+r.width/2});
  L.forEach((el,i)=>{
    const d=Math.abs(px-xs[i]),lift=Math.exp(-(d*d)/(2*26*26))*42;
    el.classList.toggle('settle',lift<2);
    el.style.setProperty('--lift',lift.toFixed(1)+'px')})}
function riffleReset(){[...cards.children].forEach(el=>{el.classList.add('settle');el.style.setProperty('--lift','0px')})}
function brush(px,py){
  const F=liveF(),R=F.map(el=>el.getBoundingClientRect());
  F.forEach((el,i)=>{const r=R[i];
    const dx=r.left+r.width/2-px,dy=r.top+r.height/2-py,d=Math.hypot(dx,dy);
    el.style.transform=(d<52&&d>.1)?`translate(calc(-50% + ${dx/d*(52-d)*.9}px),calc(-50% + ${dy/d*(52-d)*.9}px))`:'translate(-50%,-50%)'})}

document.addEventListener('pointermove',e=>{
  const g=glass.getBoundingClientRect();
  glass.style.setProperty('--gx',((e.clientX-g.left)/g.width*100)+'%');
  glass.style.setProperty('--gy',((e.clientY-g.top)/g.height*100)+'%');
  const near=e.clientX>g.left-50&&e.clientX<g.right+50&&e.clientY>g.top-50&&e.clientY<g.bottom+50;
  glass.style.setProperty('--gon',near?1:0);
  const r=folder.getBoundingClientRect();
  const nx=Math.max(-.6,Math.min(.6,(e.clientX-r.left-r.width/2)/r.width)),
        ny=Math.max(-.6,Math.min(.6,(e.clientY-r.top-r.height/2)/r.height));
  tilt.style.transform=`rotateY(${nx*8}deg) rotateX(${-ny*6}deg)`;
  riffle(e.clientX);brush(e.clientX,e.clientY);
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>8)moved=true;
},{passive:true});
document.addEventListener('pointerdown',e=>{moved=false;downX=e.clientX;downY=e.clientY;});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>riffleReset()));
document.addEventListener('pointerleave',()=>{tilt.style.transform='';glass.style.setProperty('--gon',0);riffleReset()});

/* ================= 背景飘雪 ================= */
const cvs=document.getElementById('snow'),ctx=cvs.getContext('2d');
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);layoutArc()}
resize();addEventListener('resize',resize);
let sprites=[];
function buildSprites(){
  const col=isDark()?'255,255,255':'190,200,215';
  sprites=[36,56,88].map((px,i)=>{
    const blur=[2,5,10][i],c=document.createElement('canvas');
    c.width=c.height=(px+blur*4)*2;
    const g=c.getContext('2d');g.scale(2,2);
    const mid=c.width/4,r=px/2;g.translate(mid,mid);
    g.shadowColor=`rgba(${col},.9)`;g.shadowBlur=blur;g.lineCap='round';
    for(const[w,a]of[[px/14+1,.4],[px/30+.5,.95]]){
      g.strokeStyle=`rgba(${col},${a})`;g.lineWidth=w;
      for(let k=0;k<6;k++){
        g.rotate(Math.PI/3);g.beginPath();
        g.moveTo(0,0);g.lineTo(0,-r);
        g.moveTo(0,-r*.55);g.lineTo(r*.22,-r*.75);g.moveTo(0,-r*.55);g.lineTo(-r*.22,-r*.75);
        g.moveTo(0,-r*.3);g.lineTo(r*.15,-r*.45);g.moveTo(0,-r*.3);g.lineTo(-r*.15,-r*.45);
        g.stroke()}}
    return c})}
buildSprites();
const dotCol=()=>isDark()?'255,255,255':'190,200,215';
let lastDark=isDark();
setInterval(()=>{syncDark();if(isDark()!==lastDark){lastDark=isDark();buildSprites()}},1000);

const flakes=[];
for(let i=0;i<110;i++){const z=Math.random();
  flakes.push({x:Math.random()*W,y:Math.random()*H,z,vy:.25+z*1.1,ph:Math.random()*7,tw:Math.random()*7,
    rot:Math.random()*7,vr:(Math.random()-.5)*.012,crystal:z>.55&&Math.random()<.5})}
(function step(){
  const fe=window.frameElement;if(fe&&(!fe.offsetParent||fe.closest('.wet'))){setTimeout(()=>requestAnimationFrame(step),400);return}
  ctx.clearRect(0,0,W,H);const t=performance.now()/1000;
  for(const f of flakes){
    f.x+=Math.sin(t*.7+f.ph)*(.2+f.z*.5);f.y+=f.vy;f.rot+=f.vr;
    if(f.y>H+60){f.y=-60;f.x=Math.random()*W}
    if(f.x>W+60)f.x=-60;if(f.x<-60)f.x=W+60;
    const breathe=.55+.45*Math.sin(t*1.2+f.tw);
    if(f.crystal){const i=f.z>.85?2:f.z>.7?1:0,sp=sprites[i],s=sp.width/2/2;
      ctx.globalAlpha=(.14+f.z*.22)*breathe;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.drawImage(sp,-s,-s,s*2,s*2);ctx.restore()}
    else{ctx.globalAlpha=(.18+f.z*.45)*breathe;ctx.fillStyle=`rgba(${dotCol()},1)`;ctx.beginPath();ctx.arc(f.x,f.y,.8+f.z*2.4,0,7);ctx.fill()}}
  ctx.globalAlpha=1;requestAnimationFrame(step)})();
</script>
</body>
</html>
