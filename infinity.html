<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Infinity</title>
<style>
/* ============================================================
   ❆ Infinity 双层玻璃文件夹 · 透明底 · localStorage 持久化
   ============================================================ */
:root{
  --ink:#4a4f57;  --ink-soft:#9298a2;
  --back-tint:rgba(255,255,255,.22);
  --back-edge:rgba(255,255,255,.65);
  --flake-core:rgba(255,255,255,.95);
  --flake-glow:rgba(190,210,245,.8);
  --lg-a:rgba(255,255,255,.05); --lg-b:rgba(255,255,255,.01);
  --lg-c:rgba(230,238,250,.025);
  --edge-hi:rgba(255,255,255,.95);
  --edge-cool:rgba(165,195,255,.5); --edge-warm:rgba(255,205,225,.4);
  --card-bg:linear-gradient(170deg,rgba(255,255,255,.96),rgba(234,238,244,.92));
  --glow:rgba(255,255,255,.4);
  --danger:#c96a6a;
  --shadow:0 22px 44px rgba(96,106,126,.18);
  --f-script:"Snell Roundhand","Savoye LET","Apple Chancery","Zapfino",
             "Segoe Script",cursive;
  --f-en:"Didot","Bodoni 72",serif;
  --f-cn:"Songti SC","STSongti-SC","Noto Serif SC","SimSun",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#eef1f6;  --ink-soft:#979eab;
    --back-tint:rgba(120,135,165,.14);
    --back-edge:rgba(255,255,255,.3);
    --flake-core:rgba(255,255,255,.95);
    --flake-glow:rgba(170,195,255,.7);
    --lg-a:rgba(135,152,185,.05); --lg-b:rgba(80,92,118,.01);
    --lg-c:rgba(150,165,200,.02);
    --edge-hi:rgba(255,255,255,.55);
    --edge-cool:rgba(150,185,255,.45); --edge-warm:rgba(255,185,215,.3);
    --card-bg:linear-gradient(170deg,rgba(60,68,88,.95),rgba(38,44,58,.92));
    --glow:rgba(195,212,255,.3);
    --danger:#e08585;
    --shadow:0 24px 50px rgba(0,0,0,.5);
  }
}

*{margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html,body{height:100%;overflow:hidden;background:transparent;}
body{
  position:fixed;inset:0;touch-action:none;
  /* 调试底（正式嵌入保持注释）：
  background:radial-gradient(130% 100% at 50% 0%,#edeff3,#dce1e8); */
  color:var(--ink);font-family:var(--f-en),var(--f-cn);
  display:flex;align-items:center;justify-content:center;
}
#snow{position:fixed;inset:0;z-index:0;pointer-events:none;}

.stage{position:relative;z-index:2;perspective:1100px;transform:translateY(-7vh);}
.tilt{transition:transform .25s ease-out;transform-style:preserve-3d;}
.folder{position:relative;width:min(76vw,300px);height:252px;cursor:pointer;}

/* ① 后片：iOS 白玻 */
.folder-back{
  position:absolute;left:5%;right:5%;top:30px;bottom:12px;z-index:1;
  border-radius:20px;background:var(--back-tint);
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  backdrop-filter:blur(14px) saturate(180%);
  border:1px solid var(--back-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--shadow);
}
.folder-back::before{content:"";position:absolute;top:-17px;right:0;
  width:44%;height:24px;background:var(--back-tint);
  border:1px solid var(--back-edge);border-bottom:none;
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  backdrop-filter:blur(14px) saturate(180%);
  border-radius:12px 15px 0 0;}
.folder-back::after{content:"";position:absolute;top:-16px;right:calc(44% - 2px);
  width:26px;height:17px;background:var(--back-tint);border-radius:12px 0 0 0;
  transform:skewX(-34deg);transform-origin:bottom right;}

/* ② 雪花串 */
.snow-string{position:absolute;top:12px;right:15%;width:0;z-index:2;
  transform-origin:top center;animation:sway 6.5s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
.snow-string::before{content:"";position:absolute;left:-.5px;top:0;width:1px;
  height:var(--line,190px);opacity:.5;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.8) 25%,transparent);}
.glassy{filter:drop-shadow(0 0 3px var(--flake-core))
               drop-shadow(0 0 14px var(--flake-glow));}
.anchor{position:absolute;top:6px;left:2px;transform:translate(-50%,-50%);
  animation:breath 4.5s ease-in-out infinite;}
@keyframes breath{0%,100%{opacity:.95}50%{opacity:.65}}
.anchor svg{display:block;animation:flutter 8s ease-in-out infinite alternate;}
.flake{position:absolute;transform:translate(-50%,-50%);
  transition:transform .7s cubic-bezier(.2,2.1,.3,.85),top .5s,opacity .5s;
  will-change:transform;}
.flake svg{display:block;animation:flutter var(--d,4s) ease-in-out infinite alternate;}
@keyframes flutter{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
.flake i{position:absolute;left:var(--ox,14px);top:var(--oy,-5px);
  width:3.5px;height:3.5px;border-radius:50%;background:rgba(255,255,255,.9);
  box-shadow:0 11px 1px -1px rgba(255,255,255,.8);}
.flake.enter{animation:dropIn .7s cubic-bezier(.2,1.4,.3,1);}
@keyframes dropIn{from{opacity:0;margin-top:-30px}to{opacity:1;margin-top:0}}
.flake.falling{opacity:0;transform:translate(-50%,80px) rotate(220deg)!important;}

/* ③ 卡牌 */
.card-layer{position:absolute;inset:0;z-index:3;pointer-events:none;}
.folder.open .card-layer{z-index:6;}
.file-card{
  position:absolute;left:calc(50% - 24px);bottom:14px;width:48px;height:72px;
  transform-origin:50% 280%;
  transform:translate(var(--sx),var(--sy)) rotate(var(--s)) scale(.95);
  transition:transform .5s cubic-bezier(.22,1.25,.36,1),opacity .4s;
  transition-delay:var(--dl,0s);
  will-change:transform;pointer-events:auto;
}
.folder.open .file-card{transform:rotate(var(--a)) translateY(-26px);}
.file-card.dragging{
  transition:none;z-index:99!important;
  transform:translate(var(--dx,0px),var(--dy,0px)) rotate(2deg) scale(1.12)!important;
  filter:drop-shadow(0 14px 24px rgba(0,0,0,.25));
}
.file-card.removing{opacity:0;
  transform:translate(var(--dx,0px),var(--dy,0px)) scale(.2)!important;
  transition:transform .35s ease-in,opacity .35s!important;}
.pad{
  width:100%;height:100%;border-radius:9px;background:var(--card-bg);
  border:1px solid var(--edge-hi);box-shadow:0 5px 14px rgba(0,0,0,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transform:translateY(calc(var(--lift,0px) * -1));
  transition:transform .1s ease-out;position:relative;overflow:hidden;
}
.file-card.settle .pad{transition:transform .4s cubic-bezier(.2,1.6,.3,.9);}
/* 照片卡：缩略图铺满牌面 */
.pad .thumb{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.9;}
.pad .ext{font-family:var(--f-en);font-size:11px;letter-spacing:.04em;
  position:relative;z-index:1;}
.pad .fname{font-family:var(--f-cn);font-size:7.5px;color:var(--ink-soft);
  max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  position:relative;z-index:1;}
.pad .thumb~.ext,.pad .thumb~.fname{   /* 图上文字加衬底保证可读 */
  text-shadow:0 0 6px rgba(0,0,0,.4);color:#fff;}

/* ④ 前片：极透液态玻璃 */
.glass{
  position:absolute;left:0;right:0;top:74px;bottom:0;z-index:4;
  border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,var(--lg-a),var(--lg-b) 50%,var(--lg-c));
  -webkit-backdrop-filter:blur(5px) saturate(200%);
  backdrop-filter:blur(5px) saturate(200%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),
             0 18px 38px rgba(96,106,126,.14);
  transform-origin:bottom center;
  transition:transform .55s cubic-bezier(.22,1.2,.36,1);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(135deg,
    var(--edge-hi) 0%,var(--edge-cool) 22%,transparent 40%,
    transparent 60%,var(--edge-warm) 78%,var(--edge-hi) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.glass::after{
  content:"";position:absolute;top:-30%;left:-20%;width:50%;height:160%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.08) 45%,
             rgba(255,255,255,.02) 55%,transparent);
  transform:rotate(8deg);pointer-events:none;
}
.glass .glow{
  position:absolute;inset:-30%;pointer-events:none;opacity:var(--gon,0);
  background:radial-gradient(100px 80px at var(--gx,50%) var(--gy,30%),
             var(--glow),transparent 72%);
  mix-blend-mode:overlay;transition:opacity .5s;filter:blur(7px);
}
@media (hover:hover){ .folder:hover .glass{transform:rotateX(7deg);} }
.folder.open .glass{transform:rotateX(13deg) translateY(2px);}

.glass-title{
  position:absolute;left:20px;bottom:6px;
  font-family:var(--f-script);font-size:32px;font-weight:400;
  line-height:1.7;padding-right:10px;
  background:linear-gradient(120deg,var(--ink) 60%,var(--ink-soft));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

/* ⑤ 雪窖 */
#trash{
  position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));
  width:62px;height:62px;border-radius:50%;z-index:50;
  transform:translateX(-50%) scale(0);
  background:var(--lg-a);
  -webkit-backdrop-filter:blur(10px) saturate(180%);
  backdrop-filter:blur(10px) saturate(180%);
  border:1px solid var(--edge-hi);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  transition:transform .35s cubic-bezier(.2,1.5,.3,1),color .2s,border-color .2s;
}
#trash.show{transform:translateX(-50%) scale(1);}
#trash.hot{transform:translateX(-50%) scale(1.18);
  color:var(--danger);border-color:var(--danger);}
#trash svg{width:24px;height:24px;}

/* ⑥ 照片查看器（玻璃灯箱，点任意处关闭） */
#viewer{
  position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:rgba(0,0,0,.3);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#viewer.show{opacity:1;pointer-events:auto;}
#viewer img{
  max-width:86vw;max-height:66vh;border-radius:16px;
  border:1px solid var(--edge-hi);
  box-shadow:0 24px 60px rgba(0,0,0,.4);
  transform:scale(.92);transition:transform .35s cubic-bezier(.2,1.4,.3,1);
}
#viewer.show img{transform:scale(1);}
#viewer .vname{font-family:var(--f-cn);font-size:12px;letter-spacing:.3em;
  color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5);}

.toolbar{position:absolute;left:50%;transform:translateX(-50%);
  bottom:-64px;text-align:center;white-space:nowrap;}
.add-btn{display:inline-block;padding:7px 22px;border-radius:999px;
  background:var(--lg-a);border:1px solid var(--edge-hi);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-family:var(--f-cn);font-size:12px;letter-spacing:.3em;cursor:pointer;}
.tip{margin-top:8px;font-size:10px;letter-spacing:.2em;
  color:var(--ink-soft);font-family:var(--f-cn);}
input[type=file]{display:none;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="armGlass">
      <path d="M0 0 L0 -44 M0 -27 L10 -36 M0 -27 L-10 -36 M0 -14 L7 -21 M0 -14 L-7 -21"
            stroke="rgba(255,255,255,.45)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M0 0 L0 -44 M0 -27 L10 -36 M0 -27 L-10 -36 M0 -14 L7 -21 M0 -14 L-7 -21"
            stroke="rgba(255,255,255,.95)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
    <symbol id="sf" viewBox="-54 -54 108 108">
      <use href="#armGlass"/><use href="#armGlass" transform="rotate(60)"/>
      <use href="#armGlass" transform="rotate(120)"/><use href="#armGlass" transform="rotate(180)"/>
      <use href="#armGlass" transform="rotate(240)"/><use href="#armGlass" transform="rotate(300)"/>
      <circle r="4.5" fill="rgba(255,255,255,.9)"/>
    </symbol>
  </defs>
</svg>

<canvas id="snow"></canvas>

<div class="stage">
  <div class="tilt" id="tilt">
    <div class="folder" id="folder">
      <div class="folder-back"></div>
      <div class="snow-string" id="string">
        <span class="anchor glassy"><svg width="100" height="100"><use href="#sf"/></svg></span>
      </div>
      <div class="card-layer" id="cardLayer"></div>
      <div class="glass" id="glass">
        <div class="glow"></div>
        <div class="glass-title">Infinity</div>
      </div>
    </div>
    <div class="toolbar">
      <label class="add-btn" for="fileInput">＋ 存入回忆</label>
      <input id="fileInput" type="file" multiple accept="*/*">
      <div class="tip">轻触开合 · 点照片牌查看 · 长按牌拖入雪窖删除</div>
    </div>
  </div>
</div>

<div id="trash">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round"><path d="M4 7h16M10 4h4M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg>
</div>

<!-- 照片灯箱 -->
<div id="viewer"><img alt=""><div class="vname"></div></div>

<script>
/* ============================================================
   数据层：memories ↔ localStorage['infinity-files']
   结构：[{ id, name, img? }]  img 为压缩后的 dataURL
   ============================================================ */
const STORE_KEY='infinity-files';

function loadMemories(){
  try{
    const raw=JSON.parse(localStorage.getItem(STORE_KEY));
    return Array.isArray(raw)?raw:[];
  }catch(e){return [];}
}
let memories=loadMemories();                       /* ★ 不叫 cards */
let uid=memories.reduce((m,f)=>Math.max(m,f.id||0),0);

function saveMemories(){
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify(memories));
  }catch(e){
    /* 配额满：丢弃最旧一张照片的 img 再试一次 */
    const old=memories.find(m=>m.img);
    if(old){delete old.img;saveMemories();}
  }
}

/* 照片压缩：最长边 480px → JPEG dataURL */
function shrinkImage(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,480/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',.72));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null);};
    img.src=url;
  });
}

/* ================= DOM 引用 ================= */
const folder=document.getElementById('folder'),
      tilt=document.getElementById('tilt'),
      string=document.getElementById('string'),
      cardLayer=document.getElementById('cardLayer'),
      glass=document.getElementById('glass'),
      trash=document.getElementById('trash'),
      viewer=document.getElementById('viewer');

const extOf=n=>{const e=(n.split('.').pop()||'').slice(0,4);return e||'txt';};

/* ---------- 雪花串 ---------- */
const SIZES=[40,20,34,18,28,22,36,18];
function makeFlake(f,enter){
  const el=document.createElement('span');
  el.className='flake glassy'+(enter?' enter':'');
  el.dataset.id=f.id;
  const i=string.querySelectorAll('.flake').length;
  el.style.setProperty('--d',(3+(f.id*.7)%2.8)+'s');
  el.style.setProperty('--ox',(i%2?-18:16)+'px');
  el.style.setProperty('--oy',(-4-(i%3)*6)+'px');
  const s=SIZES[i%SIZES.length];
  el.innerHTML=`<svg width="${s}" height="${s}"><use href="#sf"/></svg><i></i>`;
  string.appendChild(el);
}
function layoutString(){
  const fls=[...string.querySelectorAll('.flake')];
  string.style.setProperty('--line',(fls.length*28+56)+'px');
  fls.forEach((el,i)=>{
    el.style.top=(i*28+52)+'px';
    el.style.left=(Math.sin(i*1.9)*12)+'px';
  });
}

/* ---------- 卡牌 ---------- */
function makeCard(f){
  const el=document.createElement('div');
  el.className='file-card';el.dataset.id=f.id;
  el.style.setProperty('--sx',((f.id*53)%160-80)+'px');
  el.style.setProperty('--sy',-(30+(f.id*29)%100)+'px');
  el.style.setProperty('--s',((f.id*41)%56-28)+'deg');
  /* 照片卡显示缩略图 */
  el.innerHTML=`<div class="pad">
      ${f.img?`<img class="thumb" src="${f.img}" alt="">`:''}
      <span class="ext">${extOf(f.name)}</span>
      <span class="fname">${f.name}</span></div>`;
  cardLayer.appendChild(el);
}
function layoutArc(){
  const list=[...cardLayer.children],n=list.length;
  const spread=Math.min(100,n*9);
  list.forEach((el,i)=>{
    el.style.setProperty('--a',(n===1?0:-spread/2+spread*i/(n-1))+'deg');
    el.style.setProperty('--dl',(i*22)+'ms');
    el.style.zIndex=i;
  });
}

function addMemory(name,img){
  const f={id:++uid,name};
  if(img)f.img=img;
  memories.push(f);saveMemories();              /* ★ 入库即持久化 */
  makeFlake(f,true);makeCard(f);
  layoutString();layoutArc();
}
function removeMemory(id){
  memories=memories.filter(f=>f.id!==id);
  saveMemories();                               /* ★ 删除同步存档 */
  const c=cardLayer.querySelector(`[data-id="${id}"]`);
  if(c){c.classList.add('removing');setTimeout(()=>{c.remove();layoutArc();},380);}
  const fl=string.querySelector(`.flake[data-id="${id}"]`);
  if(fl){fl.classList.add('falling');
    setTimeout(()=>{fl.remove();layoutString();},650);}
}

/* 启动：从存档恢复（无示例数据） */
memories.forEach(f=>{makeFlake(f,false);makeCard(f);});
layoutString();layoutArc();

/* ---------- 照片灯箱 ---------- */
function openViewer(f){
  viewer.querySelector('img').src=f.img;
  viewer.querySelector('.vname').textContent=f.name;
  viewer.classList.add('show');
}
viewer.addEventListener('pointerup',()=>{
  viewer.classList.remove('show');
  setTimeout(()=>{viewer.querySelector('img').src='';},300);
});

/* ================= 长按拖删 ================= */
let dragCard=null,dragTimer=null,dragStartX=0,dragStartY=0,justDragged=false;

cardLayer.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.file-card');
  if(!el||!folder.classList.contains('open'))return;
  dragStartX=e.clientX;dragStartY=e.clientY;
  dragTimer=setTimeout(()=>{
    dragCard=el;justDragged=true;
    el.classList.add('dragging');
    el.style.setProperty('--dx','0px');el.style.setProperty('--dy','0px');
    trash.classList.add('show');
    navigator.vibrate?.(20);
  },300);
});
/* 轻点照片牌 → 查看大图（展开态、非拖拽、非滑动时） */
cardLayer.addEventListener('pointerup',e=>{
  const el=e.target.closest('.file-card');
  if(!el||dragCard)return;
  clearTimeout(dragTimer);
  if(!folder.classList.contains('open')||moved||justDragged)return;
  const f=memories.find(m=>m.id===+el.dataset.id);
  if(f&&f.img){
    e.stopPropagation();          /* 不触发文件夹开合 */
    riffleReset();
    openViewer(f);
  }
});
function dragMove(e){
  if(!dragCard)return;
  dragCard.style.setProperty('--dx',(e.clientX-dragStartX)+'px');
  dragCard.style.setProperty('--dy',(e.clientY-dragStartY)+'px');
  const t=trash.getBoundingClientRect();
  trash.classList.toggle('hot',
    Math.hypot(e.clientX-(t.left+t.width/2),e.clientY-(t.top+t.height/2))<60);
}
function dragEnd(){
  clearTimeout(dragTimer);
  if(!dragCard)return;
  const id=+dragCard.dataset.id;
  if(trash.classList.contains('hot')){
    removeMemory(id);navigator.vibrate?.([15,40,15]);
  }else dragCard.classList.remove('dragging');
  dragCard=null;
  trash.classList.remove('show','hot');
  setTimeout(()=>justDragged=false,80);
}

/* ================= 常规交互 ================= */
let moved=false,downX=0,downY=0;

folder.addEventListener('pointerup',()=>{
  if(moved||justDragged)return;
  folder.classList.toggle('open');riffleReset();
});

function riffle(px){
  if(!folder.classList.contains('open')||dragCard)return;
  [...cardLayer.children].forEach(el=>{
    const r=el.getBoundingClientRect();
    const d=Math.abs(px-(r.left+r.width/2));
    const lift=Math.exp(-(d*d)/(2*36*36))*46;
    el.classList.toggle('settle',lift<2);
    el.style.setProperty('--lift',lift.toFixed(1)+'px');
  });
}
function riffleReset(){
  [...cardLayer.children].forEach(el=>{
    el.classList.add('settle');el.style.setProperty('--lift','0px');
  });
}
function brush(px,py){
  [...string.querySelectorAll('.flake')].forEach(el=>{
    const r=el.getBoundingClientRect();
    const dx=r.left+r.width/2-px,dy=r.top+r.height/2-py,d=Math.hypot(dx,dy);
    el.style.transform=(d<52&&d>.1)
      ?`translate(calc(-50% + ${dx/d*(52-d)*.9}px),calc(-50% + ${dy/d*(52-d)*.9}px))`
      :'translate(-50%,-50%)';
  });
}

document.addEventListener('pointermove',e=>{
  if(dragCard){dragMove(e);return;}
  if(Math.hypot(e.clientX-dragStartX,e.clientY-dragStartY)>10)clearTimeout(dragTimer);

  const g=glass.getBoundingClientRect();
  glass.style.setProperty('--gx',((e.clientX-g.left)/g.width*100)+'%');
  glass.style.setProperty('--gy',((e.clientY-g.top)/g.height*100)+'%');
  const near=e.clientX>g.left-50&&e.clientX<g.right+50&&
             e.clientY>g.top-50&&e.clientY<g.bottom+50;
  glass.style.setProperty('--gon',near?1:0);

  const r=folder.getBoundingClientRect();
  const nx=Math.max(-.6,Math.min(.6,(e.clientX-r.left-r.width/2)/r.width)),
        ny=Math.max(-.6,Math.min(.6,(e.clientY-r.top-r.height/2)/r.height));
  tilt.style.transform=`rotateY(${nx*8}deg) rotateX(${-ny*6}deg)`;

  riffle(e.clientX);brush(e.clientX,e.clientY);
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>8)moved=true;
},{passive:true});
document.addEventListener('pointerdown',e=>{moved=false;downX=e.clientX;downY=e.clientY;});
['pointerup','pointercancel'].forEach(ev=>
  document.addEventListener(ev,()=>{dragEnd();riffleReset();}));
document.addEventListener('pointerleave',()=>{
  tilt.style.transform='';glass.style.setProperty('--gon',0);riffleReset();
});

/* ---------- 文件入口：照片压缩入库，其他只存文件名 ---------- */
async function ingest(fileList){
  for(const file of fileList){
    if(file.type&&file.type.startsWith('image/')){
      const img=await shrinkImage(file);       /* 缩图 → dataURL */
      addMemory(file.name,img);
    }else{
      addMemory(file.name);
    }
  }
}
['dragover','dragenter','dragleave','drop'].forEach(ev=>
  document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('drop',e=>ingest(e.dataTransfer?.files||[]));
document.getElementById('fileInput').addEventListener('change',e=>{
  ingest(e.target.files);e.target.value='';
});

/* ================= 背景飘雪（与上版相同） ================= */
const cvs=document.getElementById('snow'),ctx=cvs.getContext('2d');
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener('resize',resize);

const mq=matchMedia('(prefers-color-scheme: dark)');
let sprites=[];
function buildSprites(){
  const col=mq.matches?'255,255,255':'190,200,215';
  sprites=[36,56,88].map((px,i)=>{
    const blur=[2,5,10][i],c=document.createElement('canvas');
    c.width=c.height=(px+blur*4)*2;
    const g=c.getContext('2d');g.scale(2,2);
    const mid=c.width/4,r=px/2;
    g.translate(mid,mid);
    g.shadowColor=`rgba(${col},.9)`;g.shadowBlur=blur;g.lineCap='round';
    for(const[w,a]of[[px/14+1,.4],[px/30+.5,.95]]){
      g.strokeStyle=`rgba(${col},${a})`;g.lineWidth=w;
      for(let k=0;k<6;k++){
        g.rotate(Math.PI/3);g.beginPath();
        g.moveTo(0,0);g.lineTo(0,-r);
        g.moveTo(0,-r*.55);g.lineTo(r*.22,-r*.75);
        g.moveTo(0,-r*.55);g.lineTo(-r*.22,-r*.75);
        g.moveTo(0,-r*.3);g.lineTo(r*.15,-r*.45);
        g.moveTo(0,-r*.3);g.lineTo(-r*.15,-r*.45);
        g.stroke();
      }
    }
    return c;
  });
}
buildSprites();mq.addEventListener?.('change',buildSprites);
const dotCol=()=>mq.matches?'255,255,255':'190,200,215';

const flakes=[];
function spawn(){
  const z=Math.random();
  flakes.push({x:Math.random()*W,y:Math.random()*H,z,
    vy:.25+z*1.1,ph:Math.random()*7,tw:Math.random()*7,
    rot:Math.random()*7,vr:(Math.random()-.5)*.012,
    crystal:z>.55&&Math.random()<.5});
}
for(let i=0;i<110;i++)spawn();

(function step(){
  ctx.clearRect(0,0,W,H);
  const t=performance.now()/1000;
  for(const f of flakes){
    f.x+=Math.sin(t*.7+f.ph)*(.2+f.z*.5);
    f.y+=f.vy;f.rot+=f.vr;
    if(f.y>H+60){f.y=-60;f.x=Math.random()*W;}
    if(f.x>W+60)f.x=-60;if(f.x<-60)f.x=W+60;
    const breathe=.55+.45*Math.sin(t*1.2+f.tw);
    if(f.crystal){
      const i=f.z>.85?2:f.z>.7?1:0,sp=sprites[i],s=sp.width/2/2;
      ctx.globalAlpha=(.14+f.z*.22)*breathe;
      ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
      ctx.drawImage(sp,-s,-s,s*2,s*2);ctx.restore();
    }else{
      ctx.globalAlpha=(.18+f.z*.45)*breathe;
      ctx.fillStyle=`rgba(${dotCol()},1)`;
      ctx.beginPath();ctx.arc(f.x,f.y,.8+f.z*2.4,0,7);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(step);
})();
</script>
