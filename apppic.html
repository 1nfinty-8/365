<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 图标 B</title>
<style>
body{margin:0;padding:40px 20px;background:#E9E3E4;font-family:-apple-system,'PingFang SC',sans-serif;color:#2E1A1F;text-align:center}
img{width:260px;height:260px;border-radius:58px;box-shadow:0 8px 24px rgba(60,30,40,.18);display:block;margin:0 auto}
button{margin-top:28px;background:#2E1A1F;color:#fff;border:0;padding:14px 32px;border-radius:99px;font-size:17px}
p{font-size:13px;color:#8C7A80;margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<img id="pic" alt="">
<button id="save">存储图标</button>
<p>点按钮 → 选「存储到文件」→ 存到「下载」文件夹<br>文件名已经是 apple-touch-icon.png</p>
<script>
const S=512,SLANT=0.22;
const NUM=s=>`italic 300 ${s}px ui-serif, 'New York', Georgia, serif`;
const EN=s=>`italic 400 ${s}px Didot, 'Bodoni 72', Georgia, serif`;
const c=document.createElement('canvas');c.width=c.height=S;
const x=c.getContext('2d');x.textBaseline='alphabetic';
// 白色渐变背景
const g=x.createLinearGradient(0,0,S,S);
g.addColorStop(0,'#FFFFFF');g.addColorStop(.55,'#F8F5F5');g.addColorStop(1,'#ECE5E6');
x.fillStyle=g;x.fillRect(0,0,S,S);
const r=x.createRadialGradient(S*.25,S*.18,0,S*.25,S*.18,S*.7);
r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=r;x.fillRect(0,0,S,S);
// 365
x.font=NUM(100);const size=100*360/x.measureText('365').width;
x.save();x.translate(50,400);x.transform(1,0,-SLANT,1,0,0);
x.fillStyle='#2E1A1F';x.font=NUM(size);x.textAlign='left';x.fillText('365',0,0);x.restore();
// infinity
x.fillStyle='#8C7A80';x.font=EN(24);x.textAlign='left';
let px=62;for(const ch of 'infinity'){x.fillText(ch,px,448);px+=x.measureText(ch).width+6}
// 显示和保存
document.getElementById('pic').src=c.toDataURL('image/png');
let file;
c.toBlob(b=>{file=new File([b],'apple-touch-icon.png',{type:'image/png'})},'image/png');
document.getElementById('save').onclick=async()=>{
  if(!file)return;
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]})}catch(e){}
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download='apple-touch-icon.png';a.click();
  }
};
</script>
</body>
</html>
