<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 检查</title>
<style>
body{font:15px/1.6 -apple-system,'PingFang SC',sans-serif;padding:24px 16px 60px;background:#F2F2F7;color:#000;margin:0}
h1{font-size:20px;margin:0 0 4px}
.tip{color:#6e6e73;font-size:13px;margin:0 0 10px}
.r{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
.ok{color:#34C759}.bad{color:#FF3B30}
small{color:#6e6e73;word-break:break-all;display:block;margin-top:2px}
.cp{font:inherit;font-size:13px;margin-top:8px;padding:6px 14px;border:0;border-radius:99px;background:#E5E5EA;color:#000}
#clr{font:inherit;padding:13px;border:0;border-radius:12px;background:#000;color:#fff;margin-top:14px;width:100%}
</style>
</head>
<body>
<h1>365 文件检查</h1>
<p class="tip">自动检查 index.html 里加载的所有文件 · 点「复制代码」可以复制整个文件</p>
<div id="out">检查中…</div>
<button id="clr">清除缓存（不会删数据）</button>
<script>
const TEXT={};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const get=async f=>{const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'});return {ok:r.ok,status:r.status,text:r.ok?await r.text():''}};
function row(f,ok,msg,has){return `<div class="r"><b class="${ok?'ok':'bad'}">${ok?'✓':'✗'} ${esc(f)}</b>${msg.map(m=>`<small>${esc(m)}</small>`).join('')}${has?`<button class="cp" data-f="${esc(f)}">复制代码</button>`:''}</div>`}
(async()=>{
  let h='',bad=0,idx='';
  const I=await get('index.html').catch(()=>({ok:false,status:0,text:''}));idx=I.text;
  const JS=[...idx.matchAll(/<script\s+src="([^"]+)"/g)].map(m=>m[1]);
  const uniq=[...new Set(JS)];
  {const msg=[],ok0=I.ok;let ok=ok0;
    if(!ok0)msg.push('⚠️ 读不到 index.html');
    else{TEXT['index.html']=idx;
      msg.push(idx.length+' 字 · 加载了 '+uniq.length+' 个 js 文件');
      if(!idx.trim().endsWith('</html>')){ok=false;msg.push('⚠️ 结尾不是 </html>，被截断了')}
      const dup=uniq.filter(n=>JS.filter(x=>x===n).length>1);
      if(dup.length){ok=false;msg.push('⚠️ 加载了两遍：'+dup.join('、'))}
      if(uniq[0]!=='app.js'){ok=false;msg.push('⚠️ 第一个加载的必须是 app.js')}}
    if(!ok)bad++;h+=row('index.html',ok,msg,ok0)}
  for(const f of ['style.css',...uniq,'sw.js','manifest.json']){
    let ok=true;const msg=[];
    try{
      const r=await get(f);
      if(!r.ok){bad++;h+=row(f,false,[uniq.includes(f)?'⚠️ index.html 里加载了它，但仓库里没有这个文件（'+r.status+'）。要么新建这个文件，要么把 index.html 里那一行删掉':'⚠️ 找不到这个文件（'+r.status+'）'],false);continue}
      const s=r.text;TEXT[f]=s;
      msg.push(s.length+' 字 · 最后一行：'+s.trim().split('\n').pop().trim().slice(-40));
      if(f.endsWith('.js')){
        if(f!=='app.js'&&f!=='sw.js'&&!s.slice(0,200).includes(f)){ok=false;msg.push('⚠️ 开头不是 '+f+' 的代码，可能粘错文件了')}
        try{new Function(s)}catch(e){ok=false;msg.push('⚠️ 代码不完整或有错：'+e.message)}}
      if(f==='style.css'){const a=(s.match(/{/g)||[]).length,b=(s.match(/}/g)||[]).length;
        if(a!==b){ok=false;msg.push(`⚠️ 括号对不上（{ ${a} 个，} ${b} 个）`)}}
      if(f==='manifest.json'){try{JSON.parse(s)}catch(e){ok=false;msg.push('⚠️ 格式不对')}}
    }catch(e){ok=false;msg.push('读取失败：'+e.message)}
    if(!ok)bad++;h+=row(f,ok,msg,!!TEXT[f])}
  out.innerHTML=(bad?`<div class="r bad">有 ${bad} 个文件需要看一下</div>`:'<div class="r ok">全部正常 ✓</div>')+h;
})();
out.onclick=e=>{const b=e.target.closest('.cp');if(!b)return;const t=TEXT[b.dataset.f];
  const done=()=>{b.textContent='已复制 ✓'};
  const old=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()};
  navigator.clipboard?navigator.clipboard.writeText(t).then(done,old):old()};
document.getElementById('clr').onclick=async()=>{
  try{
    const regs=navigator.serviceWorker?await navigator.serviceWorker.getRegistrations():[];
    for(const r of regs)await r.unregister();
    if(window.caches)for(const k of await caches.keys())await caches.delete(k);
    alert('缓存清好了，数据没有动');
  }catch(e){alert('清除失败：'+e.message)}
};
</script>
</body>
</html>
